name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify
        working-directory: ./tourism-service

  flyway-baseline-check:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tourismdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: tourismdb
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-not-used-in-production-32bytes+
      ADMIN_PASSWORD: ci-only-password-not-used-in-production
      GOOGLE_MAPS_API_KEY: ci-only-dummy-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Package application
        run: mvn -B clean package -DskipTests
        working-directory: ./tourism-service

      - name: "Step 1: create schema the old way (simulates your existing live database)"
        working-directory: ./tourism-service
        run: |
          nohup java -jar target/*.jar \
            --spring.jpa.hibernate.ddl-auto=update \
            --spring.flyway.enabled=false \
            --spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect \
            > step1.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null; then
              echo "App is up (ddl-auto=update)"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8081/actuator/health || (echo "App failed to start on step 1" && cat step1.log && exit 1)
          kill "$(cat app.pid)" || true
          sleep 3

      - name: "Step 2: reboot with ddl-auto=validate + Flyway baseline (this is what Render will actually run)"
        working-directory: ./tourism-service
        run: |
          nohup java -jar target/*.jar \
            --spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect \
            > step2.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null; then
              echo "App is up (validate + flyway baseline)"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8081/actuator/health || (echo "Baseline/validate boot failed — see log below" && cat step2.log && exit 1)
          kill "$(cat app.pid)" || true

      - name: Show logs on failure
        if: failure()
        working-directory: ./tourism-service
        run: |
          echo "--- step1.log ---"; cat step1.log 2>/dev/null || true
          echo "--- step2.log ---"; cat step2.log 2>/dev/null || true