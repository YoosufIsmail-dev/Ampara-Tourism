server.port=${PORT:8081}
spring.application.name=tourism-service

# --- Health check (Render/Docker) - only /actuator/health is exposed, nothing sensitive ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# In-memory H2 database - swap for PostgreSQL in production (see README)
spring.datasource.url=jdbc:h2:mem:tourismdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Set the OPENAI_API_KEY environment variable before starting this service.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.4

# --- JWT ---
# Change this secret before deploying anywhere real. Must be 256+ bits for HS256.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# --- Seeded admin account (created on first startup only) ---
app.admin.email=${ADMIN_EMAIL:admin@ampara-tourism.example}
app.admin.password=${ADMIN_PASSWORD:}

# --- Weather (OpenWeatherMap) - placeholder until you add a key ---
app.weather.api-key=${WEATHER_API_KEY:}
app.weather.forecast-url=${WEATHER_FORECAST_URL:https://api.openweathermap.org/data/2.5/forecast}

# --- Google Maps - placeholder until you add a key ---
app.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.google-maps.places-url=${GOOGLE_PLACES_URL:https://places.googleapis.com/v1/places:searchText}
app.google-maps.routes-url=${GOOGLE_ROUTES_URL:https://routes.googleapis.com/directions/v2:computeRoutes}

# --- Public base URL used to build QR code deep links (e.g. https://ampara-tourism.example) ---
app.public-base-url=${PUBLIC_BASE_URL:https://ampara-tourism.example}

# --- Cloudinary (image upload) - placeholders until you add credentials ---
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# --- Email (SMTP) - disabled by default, logs instead of sending. Set app.mail.enabled=true once configured. ---
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@ampara-tourism.example}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Firebase Cloud Messaging (push notifications) - placeholder until you add credentials ---
# Base64-encode your Firebase service-account JSON (Project Settings -> Service accounts ->
# Generate new private key) and set it as this env var, e.g.:
#   export FIREBASE_CREDENTIALS_BASE64=$(base64 -i service-account.json)
app.firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- BusTimetable.lk public timetable source ---
# Published schedule source; not live GPS/vehicle telemetry.
app.bus-timetable.base-url=${BUS_TIMETABLE_BASE_URL:https://bustimetable.lk}
app.bus-timetable.cache-seconds=${BUS_TIMETABLE_CACHE_SECONDS:600}

# --- TimeKeeper.lk public timetable source ---
# Published schedule source; not live GPS/vehicle telemetry.
app.timekeeper.base-url=${TIMEKEEPER_BASE_URL:https://www.timekeeper.lk}
app.timekeeper.cache-seconds=${TIMEKEEPER_CACHE_SECONDS:600}

# --- Resilience / performance ---
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:0}
spring.jpa.open-in-view=false
spring.mvc.async.request-timeout=${HTTP_REQUEST_TIMEOUT_MS:30000}
spring.lifecycle.timeout-per-shutdown-phase=20s

# Bounded application caches
app.cache.max-entries=${CACHE_MAX_ENTRIES:2000}
app.cache.default-ttl-seconds=${CACHE_DEFAULT_TTL_SECONDS:600}
app.cache.nearby-ttl-seconds=${CACHE_NEARBY_TTL_SECONDS:60}
app.cache.nearby-max-entries=${CACHE_NEARBY_MAX_ENTRIES:1000}
app.cache.external-max-entries=${CACHE_EXTERNAL_MAX_ENTRIES:1000}

# Basic per-instance request protection; use WAF/CDN limits as the global layer when scaled out.
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
app.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:20}

# External provider timeouts: prevent a slow third-party API from holding server threads indefinitely.
integration.http.connect-timeout-ms=${EXTERNAL_CONNECT_TIMEOUT_MS:5000}
integration.http.read-timeout-ms=${EXTERNAL_READ_TIMEOUT_MS:10000}
